name: Publish TreeList to user site

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [publish]

permissions:
  contents: write

concurrency:
  group: publish-main
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this Pages repo
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout TreeList source
        uses: actions/checkout@v4
        with:
          repository: ateamowner/treelist
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static export
        working-directory: src
        run: |
          npm install
          npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://treelist.ai

      - name: Replace published files
        run: |
          find site -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a src/out/. site/
          echo treelist.ai > site/CNAME
          touch site/.nojekyll

      - name: Commit and push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No publish changes"
            exit 0
          fi
          git commit -m "Publish TreeList static export"
          git push origin HEAD:main
